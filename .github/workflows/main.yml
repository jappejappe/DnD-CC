name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Web Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dnd-cc-ts9j.onrender.com/)
          echo "Status retornado: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Servico nao respondeu 200 OK"
          fi